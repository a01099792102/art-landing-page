<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제1회 ART 전시회 관리자 로그인</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="./css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <section class="login-panel">
      <div class="panel-card narrow-card">
        <p class="eyebrow">Admin Access</p>
        <h1>관리자 페이지</h1>
        <p class="panel-copy">기본 비밀번호는 <strong>1234</strong>입니다. 로그인 후 관리자 페이지 안에서 비밀번호를 바꿀 수 있습니다.</p>
        <form class="stack-form" id="admin-login-form">
          <label class="field">
            <span>비밀번호</span>
            <input id="admin-password-input" type="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" type="submit">로그인</button>
        </form>
        <button class="ghost-button reset-button" type="button" id="admin-reset-button">이 브라우저 비밀번호를 1234로 초기화</button>
        <p class="message" id="admin-login-message" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const DEFAULT_PASSWORD = "1234";
      const PASSWORD_KEY = "art-admin-password";
      const SESSION_KEY = "art-admin-authenticated";
      const form = document.getElementById("admin-login-form");
      const input = document.getElementById("admin-password-input");
      const message = document.getElementById("admin-login-message");
      const resetButton = document.getElementById("admin-reset-button");

      function getPassword() {
        try {
          return localStorage.getItem(PASSWORD_KEY) || DEFAULT_PASSWORD;
        } catch (error) {
          return DEFAULT_PASSWORD;
        }
      }

      function setPassword(value) {
        try {
          localStorage.setItem(PASSWORD_KEY, value);
        } catch (error) {
          // no-op
        }
      }

      function setSession() {
        try {
          sessionStorage.setItem(SESSION_KEY, "true");
        } catch (error) {
          // no-op
        }
      }

      function setMessage(text, isSuccess) {
        message.textContent = text;
        message.classList.toggle("is-success", Boolean(isSuccess));
      }

      setPassword(getPassword());

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        const value = String(input.value || "").trim();
        const storedPassword = getPassword();

        if (value === DEFAULT_PASSWORD || value === storedPassword) {
          setSession();
          window.location.href = "./admin-dashboard.html";
          return;
        }

        setMessage("비밀번호가 올바르지 않습니다.", false);
      });

      resetButton.addEventListener("click", function () {
        setPassword(DEFAULT_PASSWORD);
        setMessage("이 브라우저의 관리자 비밀번호를 1234로 초기화했습니다.", true);
        input.value = "";
        input.focus();
      });

      input.focus();
    }());
  </script>
</body>
</html>
